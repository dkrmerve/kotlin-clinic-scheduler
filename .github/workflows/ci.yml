name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Lint, test (H2 + PostgreSQL), coverage gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (ktlint, fast suite on H2, coverage verification)
        run: ./gradlew build -x integrationTest

      - name: Integration suite on PostgreSQL (Testcontainers)
        run: ./gradlew integrationTest

      - name: Coverage report
        if: always()
        run: ./gradlew koverHtmlReport

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-xml
          path: |
            build/test-results/test/*.xml
            build/test-results/integrationTest/*.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kover-html
          path: build/reports/kover/html

  docker:
    name: Docker image (tests run inside the build) + Trivy scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kotlin-clinic-scheduler:ci .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: kotlin-clinic-scheduler:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
